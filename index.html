<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공휴일 조회</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 0 16px; }
    nav a { margin-right: 12px; }
    li { padding: 6px 0; }
  </style>
</head>
<body>
  <nav><a href="index.html">월별 조회</a><a href="stats.html">연간 통계</a></nav>
  <h1>📅공휴일 조회</h1>
  <input id="year" type="number" value="2026">년
  <input id="month" type="number" value="10" min="1" max="12">월
  <button onclick="search()">조회</button>
  <ul id="result"></ul>

  <script src="app.js"></script>
  <script>
    async function search() {
      const box = document.getElementById("result");
      box.innerHTML = "불러오는 중...";
      try {
        const list = await getHolidays(year.value, month.value);
        box.innerHTML = list.length
          ? list.map(h => `<li>${h.locdate} - ${h.dateName}</li>`).join("")
          : "<li>이 달은 공휴일이 없어요.</li>";
      } catch (e) {
        box.innerHTML = "오류: " + e.message;
      }
    }
  </script>
</body>
</html>
